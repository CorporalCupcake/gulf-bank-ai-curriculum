<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Short Study Plan</title>
<script src="assets/catalog.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible+Next:ital,wght@0,400..800;1,400..800&family=Atkinson+Hyperlegible+Mono:wght@400..600&display=swap">
<style>
:root {
  --bg: #F4F6F8;
  --surface: #FFFFFF;
  --ink: #13202A;
  --muted: #5B6977;
  --line: #DCE2E8;
  --accent: #0B6A5B;
  --accent-soft: #DFEFEA;
  --t-day: #0B6A5B;
  --t-day-soft: #DFEFEA;
  --t-90: #8A5B00;
  --t-90-soft: #F6EBD5;
  --t-edge: #5A3E9E;
  --t-edge-soft: #ECE6F7;
  --star: #A86A00;
  --fast: #B8430E;
  --font-display: "Atkinson Hyperlegible Next", "Atkinson Hyperlegible", -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  --font-body: "Atkinson Hyperlegible Next", "Atkinson Hyperlegible", -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  --font-mono: "Atkinson Hyperlegible Mono", ui-monospace, "SF Mono", Menlo, Consolas, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #000000; --surface: #0D0D0F; --ink: #EDEDEF; --muted: #9B9BA3; --line: #26262B;
    --accent: #52C4AA; --accent-soft: #15302A;
    --t-day: #52C4AA; --t-day-soft: #15302A;
    --t-90: #E3AC45; --t-90-soft: #33281A;
    --t-edge: #AE93EE; --t-edge-soft: #272138;
    --star: #E8B84E; --fast: #F08A5D;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #000000; --surface: #0D0D0F; --ink: #EDEDEF; --muted: #9B9BA3; --line: #26262B;
  --accent: #52C4AA; --accent-soft: #15302A;
  --t-day: #52C4AA; --t-day-soft: #15302A;
  --t-90: #E3AC45; --t-90-soft: #33281A;
  --t-edge: #AE93EE; --t-edge-soft: #272138;
  --star: #E8B84E; --fast: #F08A5D;
  color-scheme: dark;
}

:root { --p-must: #B8430E; --p-stats: #1D5FBF; --p-gen: #5A3E9E; --p-next: #0B6A5B; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --p-must: #F08A5D; --p-stats: #6FA8FF; --p-gen: #B99CF5; --p-next: #52C4AA; } }
:root[data-theme="dark"] { --p-must: #F08A5D; --p-stats: #6FA8FF; --p-gen: #B99CF5; --p-next: #52C4AA; }
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--ink); font-family: var(--font-body); font-size: 15px; line-height: 1.5; -webkit-font-smoothing: antialiased; }
.wrap { max-width: 1000px; margin: 0 auto; padding: 24px max(16px, env(safe-area-inset-left, 0px)) 60px; }
a { color: inherit; }
.top { display: flex; justify-content: space-between; align-items: center; gap: 12px; font-size: 13px; color: var(--muted); }
.top a { color: var(--accent); }
h1 { font-family: var(--font-display); font-size: clamp(26px, 6vw, 36px); margin: 14px 0 6px; }
.lede { color: var(--muted); max-width: 64ch; margin: 0 0 18px; }
.keys { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 10px; margin-bottom: 14px; }
.key { background: var(--surface); border: 1px solid var(--line); border-left: 4px solid var(--c); border-radius: 10px; padding: 10px 12px; cursor: pointer; text-align: left; font: inherit; color: inherit; }
.key[aria-pressed="false"] { opacity: .45; }
.key .n { font-weight: 700; color: var(--c); }
.key .s { display: block; font-size: 13px; color: var(--muted); }
.bar { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin: 6px 0 14px; font-size: 14px; color: var(--muted); }
.bar button { font: inherit; color: var(--ink); background: var(--surface); border: 1px solid var(--line); border-radius: 999px; padding: 6px 14px; cursor: pointer; }
.bar button[aria-pressed="true"] { border-color: var(--accent); color: var(--accent); }
table { width: 100%; border-collapse: collapse; }
th { text-align: left; font-size: 12px; text-transform: uppercase; letter-spacing: .05em; color: var(--muted); font-weight: 600; padding: 8px 8px; border-bottom: 1px solid var(--line); position: sticky; top: 0; background: var(--bg); }
td { padding: 9px 8px; border-bottom: 1px solid var(--line); vertical-align: top; }
tr.mod td { padding-top: 18px; font-family: var(--font-display); font-weight: 700; font-size: 14px; color: var(--muted); border-bottom: none; }
td.code { font-family: var(--font-mono); font-size: 12.5px; white-space: nowrap; }
td.min, td.tier { font-size: 13px; white-space: nowrap; color: var(--muted); }
tr.row td:first-child { border-left: 4px solid transparent; }
tr.row.in td:first-child { border-left-color: var(--c); }
tr.row.in td { color: var(--c); }
tr.row.in td.t a { font-weight: 650; }
tr.row.out td { color: var(--muted); opacity: .6; }
td.t a { text-decoration: none; }
td.t a:hover { text-decoration: underline; }
.tag { display: inline-block; font-size: 11.5px; font-weight: 700; border: 1px solid currentColor; border-radius: 999px; padding: 0 8px; margin-left: 6px; white-space: nowrap; }
.done { color: var(--ok, var(--accent)); font-weight: 700; margin-left: 6px; }
.hide { display: none; }
@media (max-width: 620px) { td.tier, th.tier { display: none; } td.code { white-space: normal; } }
</style>
</head>
<body>
<div class="wrap">
  <div class="top"><a href="index.html">← Full curriculum</a><span id="tot"></span></div>
  <h1>Short study plan</h1>
  <p class="lede">Every lesson, in the order the site uses. Coloured rows are in the short plan, and the colour shows which part of it. Grey rows are outside the plan: come back to them if you have time. Tap a box to show or hide that group.</p>
  <div class="keys" id="keys"></div>
  <div class="bar"><button type="button" id="only" aria-pressed="false">Show only the plan</button><span id="shown"></span></div>
  <table>
    <thead><tr><th>Code</th><th>Lesson</th><th class="tier">Tier</th><th>Min</th></tr></thead>
    <tbody id="rows"></tbody>
  </table>
</div>
<script>
(function () {
  const GROUPS = [
    { id: "must", name: "Must-do", c: "var(--p-must)", d: "Framing, leakage, trees, explanations, governance, rules, communication", codes: ["C1.1","F3.1","F2.6","F4.3","F8.1","G3.1","A12.1","C2.1"] },
    { id: "bank", name: "Must-do: pick one", c: "var(--p-must)", d: "The banking lesson that matches your team", codes: ["B1.1","B2.1","B4.1"] },
    { id: "stats", name: "Stats core", c: "var(--p-stats)", d: "Intervals, tests, regression and R², classification and forecast metrics, drift, experiments, validation", codes: ["F2.1","F2.3","F2.5","F7.1","F7.5","F7.7","F3.6","F4.5"] },
    { id: "gen", name: "GenAI and agents core", c: "var(--p-gen)", d: "LLMs, prompting, RAG, agents, security, evals, production", codes: ["M1.1","M1.5","M2.1","M2.3","M3.1","M3.5","M3.7","M3.9","M4.1","M4.3","M4.5","A2.1","A3.1","M5.1","M5.3","M5.5","A4.1","A5.1","P5.1","A15.1","A12.3"] },
    { id: "next", name: "Next tier", c: "var(--p-next)", d: "If you have time: reranking, agentic RAG, Arabic LLMs, business case, imbalanced data, causal", codes: ["M3.3","A6.3","A2.3","A3.3","A14.1","A16.1","R13.1","F3.5","F9.3"] }
  ];
  const TIER = { d: "Day one", n: "90 days", e: "Edge" };
  const cat = window.CATALOG || [], P = window.PROGRESS;
  const esc = s => String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;");
  const groupOf = {};
  GROUPS.forEach(g => g.codes.forEach(c => { if (!groupOf[c]) groupOf[c] = g; }));
  const first = x => x.label.split(/[\s·–]+/)[0];
  const on = new Set(GROUPS.map(g => g.id));
  let only = false;

  const keys = document.getElementById("keys");
  GROUPS.forEach(g => {
    const items = cat.filter(x => groupOf[first(x)] === g);
    const mins = items.reduce((a, x) => a + x.minutes, 0);
    const done = P ? items.filter(x => P.done(x.file)).length : 0;
    const b = document.createElement("button");
    b.type = "button"; b.className = "key"; b.style.setProperty("--c", g.c); b.setAttribute("aria-pressed", "true");
    b.innerHTML = `<span class="n">${g.name}</span> · ${items.length} lessons · ${g.id === "bank" ? "~" + Math.round(mins / items.length) + " min (one)" : "~" + (mins / 60).toFixed(1) + " h"}${done ? ` · ${done} done` : ""}<span class="s">${g.d}</span>`;
    b.addEventListener("click", () => { on.has(g.id) ? on.delete(g.id) : on.add(g.id); b.setAttribute("aria-pressed", String(on.has(g.id))); paint(); });
    keys.appendChild(b);
  });

  const tb = document.getElementById("rows");
  let html = "", mod = null;
  cat.forEach(x => {
    if (x.module !== mod) { mod = x.module; html += `<tr class="mod" data-mod="${esc(mod)}"><td colspan="4">${esc(mod)}</td></tr>`; }
    const g = groupOf[first(x)];
    const d = P && P.done(x.file);
    html += `<tr class="row ${g ? "in" : "out"}" data-g="${g ? g.id : ""}" data-mod="${esc(mod)}"${g ? ` style="--c:${g.c}"` : ""}><td class="code">${esc(x.label)}</td><td class="t"><a href="lessons/${x.file}">${esc(x.title)}</a>${g ? `<span class="tag">${g.name}</span>` : ""}${d ? '<span class="done">✓</span>' : ""}</td><td class="tier">${TIER[x.tier]}${x.star ? " ★" : ""}</td><td class="min">${x.minutes}</td></tr>`;
  });
  tb.innerHTML = html;

  const inPlan = cat.filter(x => groupOf[first(x)] && groupOf[first(x)].id !== "next");
  const bankMins = cat.filter(x => groupOf[first(x)] && groupOf[first(x)].id === "bank");
  const planMins = inPlan.filter(x => groupOf[first(x)].id !== "bank").reduce((a, x) => a + x.minutes, 0) + (bankMins[0] ? bankMins[0].minutes : 0);
  document.getElementById("tot").textContent = `Core plan ≈ ${(planMins / 60).toFixed(0)} h of ${(cat.reduce((a, x) => a + x.minutes, 0) / 60).toFixed(0)} h total`;

  function paint() {
    let n = 0;
    const rows = [...tb.querySelectorAll("tr.row")];
    rows.forEach(r => {
      const g = r.dataset.g;
      const show = g ? on.has(g) || !only : !only;
      r.classList.toggle("hide", !show);
      r.classList.toggle("in", !!g && on.has(g));
      r.classList.toggle("out", !g || !on.has(g));
      if (show) n++;
    });
    tb.querySelectorAll("tr.mod").forEach(m => {
      const any = rows.some(r => r.dataset.mod === m.dataset.mod && !r.classList.contains("hide"));
      m.classList.toggle("hide", !any);
    });
    document.getElementById("shown").textContent = `${n} of ${cat.length} lessons shown`;
  }
  document.getElementById("only").addEventListener("click", e => { only = !only; e.currentTarget.setAttribute("aria-pressed", String(only)); paint(); });
  paint();
})();
</script>
</body>
</html>
